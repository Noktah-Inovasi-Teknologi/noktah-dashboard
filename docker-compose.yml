
services:
  # Workflow Orchestration
  prefect:
    build:
      context: ./service/prefect
      dockerfile: Dockerfile
    container_name: prefect
    restart: unless-stopped
    ports:
      - "4200:4200"
    env_file:
      - .env
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_PREFECT}
      - PREFECT_LOGGING_LEVEL=DEBUG
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_UI_API_URL=http://localhost:4200/api
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_TOKEN=${JIRA_API_TOKEN}
    volumes:
      - ./service/prefect/flows:/app/flows
      - ./service/prefect/tasks:/app/tasks
      - ./service/prefect/blocks:/app/blocks
      - ./service/prefect/data:/app/data
    depends_on:
      - postgres
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Chat / RAG Platform
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "${ANYTHINGLLM_PORT:-3001}:3001"
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./service/anythingllm/.env:/app/server/.env
      - ./service/anythingllm/storage:/app/server/storage
      - ./service/anythingllm/collector/hotdir:/app/collector/hotdir
      - ./service/anythingllm/collector/outputs:/app/collector/outputs
      - ./service/anythingllm/branding/favicon.ico:/app/server/public/favicon.ico:ro
      - ./service/anythingllm/branding/apple-touch-icon.png:/app/server/public/favicon.png:ro
      - ./service/anythingllm/branding/favicon-16x16.png:/app/server/public/favicon-16x16.png:ro
      - ./service/anythingllm/branding/favicon-32x32.png:/app/server/public/favicon-32x32.png:ro
      - ./service/anythingllm/branding/apple-touch-icon.png:/app/server/public/apple-touch-icon.png:ro
      - ./service/anythingllm/branding/android-chrome-192x192.png:/app/server/public/android-chrome-192x192.png:ro
      - ./service/anythingllm/branding/android-chrome-512x512.png:/app/server/public/android-chrome-512x512.png:ro
      - ./service/anythingllm/branding/manifest.json:/app/server/public/manifest.json:ro
    environment:
      - STORAGE_DIR=/app/server/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cloudflare Tunnel (public ingress)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - anythingllm
    networks:
      - dashboard-networks

  # Database
  postgres:
    image: postgres:15.14-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_DB_DEV=${POSTGRES_DB_DEV}
      - POSTGRES_DB_PREFECT=${POSTGRES_DB_PREFECT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4G"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  dashboard-networks:
    driver: bridge
