
services:
  # Workflow Orchestration
  prefect:
    build:
      context: ./service/prefect
      dockerfile: Dockerfile
    container_name: prefect
    restart: unless-stopped
    ports:
      - "4200:4200"
    env_file:
      - .env
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_SERVER_API_PORT=4200
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_PREFECT}
      - PREFECT_LOGGING_LEVEL=DEBUG
      - PREFECT_API_URL=http://localhost:4200/api
      - PREFECT_UI_API_URL=http://localhost:4200/api
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_TOKEN=${JIRA_API_TOKEN}
      - ROACH_API_URL=http://roach:8080
      - ROACH_API_KEY=${ROACH_API_KEY}
      - HARVEST_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - HARVEST_DRIVE_PARENT_ID=${HARVEST_DRIVE_PARENT_ID}
      # Songbird content generation (feature 003)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-xiaomi/mimo-v2.5}
      - SONGBIRD_DRIVE_PARENT_ID=${SONGBIRD_DRIVE_PARENT_ID}
    volumes:
      - ./service/prefect/flows:/app/flows
      - ./service/prefect/tasks:/app/tasks
      - ./service/prefect/blocks:/app/blocks
      - ./service/prefect/data:/app/data
      # Deployment manifest — mounted so `prefect deploy` inside the container
      # sees edits without an image rebuild (it is baked in by the Dockerfile).
      - ./service/prefect/prefect.yaml:/app/prefect.yaml
      # Sheet-backed hashmap loader — mounted for the same reason.
      - ./service/prefect/hashmap.py:/app/hashmap.py
      # Field availability determinations (feature 005) — the version-controlled
      # source of truth for "can this field ever be known?". Mounted read-only:
      # it is edited in the repo and reviewed as a diff, never from inside the
      # container.
      - ./config/field_availability.yaml:/app/config/field_availability.yaml:ro
      # Extraction schema + vocabulary (feature 007), read-only for the same
      # reason. ONE declaration serving three consumers — roach's response_format,
      # roach's client-side validation, and this service's storage-boundary
      # re-validation. Mounted into roach as well; declared three times it would
      # drift silently.
      - ./config/extraction:/app/config/extraction:ro
      # Shared DB pool/transaction helpers — same reason again.
      - ./service/prefect/db.py:/app/db.py
      - social_data:/data
    depends_on:
      - postgres
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # 1G left the server sitting at ~92% steady-state (it holds flow/task
          # run state for the harvest runs, which emit ~10 task runs per item).
          memory: "2G"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prefect worker — executes scheduled/deployed flow runs from the noktah-pool
  # work pool (e.g. social-harvest-recent / social-harvest-window schedules).
  prefect-worker:
    build:
      context: ./service/prefect
      dockerfile: Dockerfile
    container_name: prefect-worker
    restart: unless-stopped
    command: ["uv", "run", "prefect", "worker", "start", "--pool", "noktah-pool"]
    # The image HEALTHCHECK probes the server API on :4200, which the worker does
    # not run — disable it so the worker is not reported unhealthy. Liveness is
    # covered by `restart: unless-stopped`.
    healthcheck:
      disable: true
    env_file:
      - .env
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - PREFECT_LOGGING_LEVEL=INFO
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - JIRA_URL=${JIRA_URL}
      - JIRA_USERNAME=${JIRA_USERNAME}
      - JIRA_TOKEN=${JIRA_API_TOKEN}
      - ROACH_API_URL=http://roach:8080
      - ROACH_API_KEY=${ROACH_API_KEY}
      - HARVEST_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - HARVEST_DRIVE_PARENT_ID=${HARVEST_DRIVE_PARENT_ID}
      # Songbird content generation (feature 003)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-xiaomi/mimo-v2.5}
      - SONGBIRD_DRIVE_PARENT_ID=${SONGBIRD_DRIVE_PARENT_ID}
    volumes:
      - ./service/prefect/flows:/app/flows
      - ./service/prefect/tasks:/app/tasks
      - ./service/prefect/blocks:/app/blocks
      - ./service/prefect/data:/app/data
      # Sheet-backed hashmap loader — mounted so edits apply without an image rebuild.
      - ./service/prefect/hashmap.py:/app/hashmap.py
      # Field availability determinations (feature 005), read-only. See above.
      - ./config/field_availability.yaml:/app/config/field_availability.yaml:ro
      # Extraction schema + vocabulary (feature 007), read-only. See above.
      - ./config/extraction:/app/config/extraction:ro
      # Shared DB pool/transaction helpers — same reason.
      - ./service/prefect/db.py:/app/db.py
      - social_data:/data
    depends_on:
      - prefect
      - postgres
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Each flow run is a subprocess inside THIS container, and a harvest
          # flow's footprint grows with the number of items it processes (~10
          # Prefect task runs per item). A 90-day harvest (30-45 items) blew
          # past 1G and the kernel SIGKILL'd the run process mid-item
          # (flow run reported as Crashed, "exited with status code -9").
          # 4G holds a long harvest plus an overlapping second run.
          memory: "4G"

  # Client Knowledge Base MCP tool server
  knowledge-base:
    build:
      context: ./service/knowledge-base
      dockerfile: Dockerfile
    container_name: knowledge-base
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - KB_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - KB_MCP_API_KEY=${KB_MCP_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
    depends_on:
      - postgres
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Noktah Hub API (service/api): the only writer of company data behind the Hub
  # (hub.noktah.co). No published port: reached only through the Cloudflare tunnel
  # at hub-api.noktah.co, whose Access application admits just the Hub Worker's
  # service token. Deliberately NOT given the whole .env: it gets only what it uses.
  api:
    build:
      context: ./service/api
      dockerfile: Dockerfile
    container_name: hub-api
    restart: unless-stopped
    environment:
      - HUB_API_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # AUD tag of the "Noktah Hub API" Access application (not a secret)
      - HUB_API_ACCESS_API_AUD=c9804e34dfdec51dd20dac8e8e0c35b323a09985005ac929abcc69d02e5b6c92
    depends_on:
      - postgres
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  # Instagram/TikTok content scraping and OpenRouter-based content analysis
  roach:
    build:
      context: ./service/roach
      dockerfile: Dockerfile
    container_name: roach
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ./service/roach/.env
    volumes:
      - ./service/roach/data:/app/data
      - ./service/roach/secrets:/app/secrets
      # Extraction schema + vocabulary (feature 007), read-only. The SAME files
      # the Prefect service mounts — roach builds its response_format and runs
      # client-side validation from them, Prefect re-validates at the storage
      # boundary. One declaration, three consumers.
      - ./config/extraction:/app/config/extraction:ro
      - social_data:/data
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # AI Chat / RAG Platform
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    restart: unless-stopped
    ports:
      - "${ANYTHINGLLM_PORT:-3001}:3001"
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./service/anythingllm/.env:/app/server/.env
      - ./service/anythingllm/storage:/app/server/storage
      - ./service/anythingllm/collector/hotdir:/app/collector/hotdir
      - ./service/anythingllm/collector/outputs:/app/collector/outputs
      - ./service/anythingllm/branding/favicon.ico:/app/server/public/favicon.ico:ro
      - ./service/anythingllm/branding/apple-touch-icon.png:/app/server/public/favicon.png:ro
      - ./service/anythingllm/branding/favicon-16x16.png:/app/server/public/favicon-16x16.png:ro
      - ./service/anythingllm/branding/favicon-32x32.png:/app/server/public/favicon-32x32.png:ro
      - ./service/anythingllm/branding/apple-touch-icon.png:/app/server/public/apple-touch-icon.png:ro
      - ./service/anythingllm/branding/android-chrome-192x192.png:/app/server/public/android-chrome-192x192.png:ro
      - ./service/anythingllm/branding/android-chrome-512x512.png:/app/server/public/android-chrome-512x512.png:ro
      - ./service/anythingllm/branding/manifest.json:/app/server/public/manifest.json:ro
    environment:
      - STORAGE_DIR=/app/server/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/ping').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Cloudflare Tunnel (public ingress)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - anythingllm
    networks:
      - dashboard-networks

  # Database
  postgres:
    image: postgres:15.14-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_DB_DEV=${POSTGRES_DB_DEV}
      - POSTGRES_DB_PREFECT=${POSTGRES_DB_PREFECT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dashboard-networks
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4G"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  social_data:

networks:
  dashboard-networks:
    driver: bridge
