[project]
name = "roach"
version = "0.1.0"
description = "Instagram/TikTok content scraping and OpenRouter-based content analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2025.1.1",
    "requests>=2.32.0",
    "gallery-dl>=1.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Already installed transitively (fastapi, gallery-dl, starlette, uvicorn all
    # require it). Declared explicitly because analyze.py now reads the extraction
    # vocabulary from config/extraction/vocabulary_v1.yaml at import time — an
    # undeclared reliance on someone else's transitive dependency is one upstream
    # change away from an ImportError at startup.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# shared/noktah_ai (the AI model list and rotation) is mounted at /app/noktah_ai in the container.
pythonpath = [".", "../../shared"]
