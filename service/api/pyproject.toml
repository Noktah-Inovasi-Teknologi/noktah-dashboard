[project]
name = "noktah-hub-api"
version = "0.1.0"
description = "Python API behind Noktah Hub: the only writer of company data, and the home of AI intake"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn>=0.37.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.11.0",
    # Verifies Cloudflare Access JWTs (RS256) against the team's published keys
    "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
