[project]
name = "knowledge-base-mcp"
version = "0.1.0"
description = "MCP tool server for the Client Knowledge Base (AnythingLLM integration)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # MCP server (FastMCP) with SSE HTTP transport
    "mcp>=1.2.0",

    # Database driver (async)
    "asyncpg>=0.30.0",

    # Data validation
    "pydantic>=2.9.0",

    # Google API integration (reused patterns from service/prefect)
    "google-api-python-client>=2.187.0",
    "google-auth>=2.40.3",

    # HTTP server (SSE transport)
    "uvicorn>=0.34.0",
    "starlette>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
