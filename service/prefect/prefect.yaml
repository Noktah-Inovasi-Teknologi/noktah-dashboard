  # ---------------------------------------------------------------------------
  # Per-competitor 3-month harvest (harvest-3mo-comp-*)
  #
  # Source of truth for the competitor list: the CLIENT_SOCIAL block of the
  # "Hashmaps" worksheet (cols R/S/T) — the same mapping songbird reads to pick
  # competitor exemplars. Dump it with:
  #   docker exec prefect python hashmap.py --block CLIENT_SOCIAL
  #
  # These exist because songbird's competitor signal was configured but never
  # collected: CLIENT_SOCIAL named four competitor handles, no deployment
  # harvested any of them, and `harvested_signals` held zero competitor rows —
  # so every "own vs competitor" comparison ran on one side of the data.
  #
  # Same shape as the client blocks above (one deployment == one account == one
  # run, days: 90, monthly on the 2nd) so competitor and client content are
  # measured identically — songbird's ranking is a *within-account* comparison,
  # which only means anything when both sides are sampled the same way.
  # Staggered 02:30-05:00 WIB, clear of the 03:00 social-harvest-sync cron.
  #
  # Adding a competitor row to the sheet does NOT create a deployment — add a
  # block here too, then `docker exec prefect prefect deploy --all`.
  # ---------------------------------------------------------------------------

