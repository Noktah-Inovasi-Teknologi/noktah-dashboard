  # https://docs.google.com/spreadsheets/d/1-aV46TIn4m_zs3vtCNeS_Bvl3Tt-tgg09uuG_NqgNNY
  # One deployment == one client == one run (roach is stateless per call; all
  # pacing/rate-limiting lives in the harvest engine).
  #
  # Schedule: monthly, on the 1st, staggered 30 minutes apart starting 17:30 WIB.
  # Slots 1-13 land on the 1st (17:30-23:30), slots 14-18 spill to the 2nd
  # (00:00-02:00) — hence the `2` day-of-month on the last five crons.
  #
  # Window: days: 31 — a monthly run collects the month it just covered. Dedup
  # (FR-021) skips already-harvested items, so the corpus still accumulates month
  # over month; the window only bounds how far back a single run reaches. A NEW
  # account therefore back-fills one month, not a quarter — run
  # `social-harvest-window --days 90` once by hand when onboarding one.
  #
  # No `harvest_name` parameter: _resolve_harvest_name (flows/common/social_harvest.py)
  # falls back to Prefect's auto-generated flow-RUN name, which is unique per run and
  # traces a delivered sheet row back to the run that produced it. The client name
  # was redundant — the sheet is already per-account — and identical across runs.
  #
