# Prefect deployment manifest for the Noktah Dashboard flows.
#
# Deploy from inside the prefect container (code lives at /app):
#   docker exec prefect prefect deploy --all
#
# Runs are executed by the `prefect-worker` container polling the `noktah-pool`
# process work pool. Deployments without `schedules` are triggered by hand
# (Prefect UI "Run", or `prefect deployment run ... --param ...`) or, for
# hub-jira-create and harvest-registry's "Jalankan sekarang", by hub-api.
#
# The social-harvest-recent/-window deployments ship with empty `profiles`; pass
# real profile URLs at run time. The scheduled monthly harvest is harvest-registry
# (spec 009), which reads its accounts from the Hub Registry; the per-account
# harvest-monthly-* deployments and the social-harvest-sync sheet sync are gone
# (the harvest sheets are retired; review marks live in the Hub).

name: prefect-noktah
prefect-version: 3.6.9

definitions:
  work_pools:
    noktah: &noktah_pool
      name: noktah-pool
  pull_steps:
    app_dir: &app_dir
      - prefect.deployments.steps.set_working_directory:
          directory: /app

deployments:
  - name: social-harvest-recent
    entrypoint: flows/social_harvest_recent.py:social_harvest_recent_flow
    work_pool:
      name: noktah-pool
    schedules: []
    parameters:
      profiles: []
      n: 10
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  - name: social-harvest-window
    entrypoint: flows/social_harvest_window.py:social_harvest_window_flow
    work_pool:
      name: noktah-pool
    schedules: []
    parameters:
      profiles: []
      # Relative window (last N days). For a manual backfill, pass
      # start_date/end_date at run time instead (they override days).
      days: 7
      start_date: null
      end_date: null
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Noktah Hub (spec 008): hub-api does the work; these only schedule it.
  - name: hub-summary-refresh
    entrypoint: flows/hub_summary_refresh.py:hub_summary_refresh_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "15 * * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # One-time Registry import (FR-014). No schedule. validate_only defaults to true;
  # the real run is a deliberate `--param validate_only=false` after review.
  - name: hub-registry-import
    entrypoint: flows/hub_registry_import.py:hub_registry_import_flow
    work_pool:
      name: noktah-pool
    parameters:
      validate_only: true
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Registry → Clients/Hashmaps sheet copies within 5 minutes (FR-016). hub-api
  # refuses to write until the import has run, so deploying this early is safe.
  - name: hub-sheet-sync
    entrypoint: flows/hub_sheet_sync.py:hub_sheet_sync_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "*/5 * * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Weekly full check (FR-018): rewrites cells edited in the sheet, reports them.
  - name: hub-sheet-check
    entrypoint: flows/hub_sheet_sync.py:hub_sheet_sync_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "0 6 * * 1"
        timezone: "Asia/Jakarta"
    parameters:
      check: true
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Removes Intake raw material older than 12 months (FR-036); excerpts stay forever.
  # 01:30, before the 02:00 backup, so the backup never holds material past its term.
  - name: hub-intake-purge
    entrypoint: flows/hub_intake_purge.py:hub_intake_purge_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "30 1 * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Nightly backup of the company database to Company > Backups > Database in
  # Drive, keeping the newest 14. Runs at 02:00, clear of the 03:00 sync and
  # 03:30 roster jobs. Failures post to #noktah-otomasi.
  - name: db-backup
    entrypoint: flows/db_backup.py:db_backup_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "0 2 * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Velocity derive (feature 006-longitudinal-metric-capture) — turns the
  # append-only observation history into rate of change. Reads the datastore
  # only: no platform request, no model call.
  #
  # 06:00 on the 2nd. harvest-registry starts 17:30 on the 1st and spaces accounts
  # 30 minutes apart, so with ~20+ accounts its tail can still be running at 06:00.
  # Deriving before a harvest finishes is harmless (the next run picks up the rest,
  # and `velocity_status.not_yet_derived` makes the gap visible).
  #
  # Separate from collection on purpose: a derivation failure must not affect a
  # harvest, and a blocked profile must not prevent derivation over what was
  # already observed.
  - name: velocity-derive
    entrypoint: flows/velocity_derive.py:velocity_derive_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "0 6 2 * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Observation backfill (feature 006) — one-time seeding of pre-feature signal
  # rows as `legacy` observations.
  #
  # UNSCHEDULED by design, and NOT a parameter on velocity-derive: that flow is
  # monthly, and a one-shot operation riding on it would fire every month if its
  # default were ever wrong. Idempotent, so re-running is harmless.
  - name: observation-backfill
    entrypoint: flows/observation_backfill.py:observation_backfill_flow
    work_pool:
      name: noktah-pool
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Roster sync (feature 004-relational-spine) — reconciles clients/accounts/roles
  # from the Clients + Hashmaps worksheets into the datastore. Daily, clear of the
  # 03:00 social-harvest-sync slot. Nothing gates collection/generation on this
  # (FR-022a) — it is also triggerable on demand for an immediate sheet edit.
  - name: roster-sync
    entrypoint: flows/roster_sync.py:roster_sync_flow
    work_pool:
      name: noktah-pool
    schedules:
      - cron: "30 3 * * *"
        timezone: "Asia/Jakarta"
        # Off since the Hub owns the roster (spec 008 import): a redeploy must not
        # turn it back on, or it would rewrite the roster from the sheet.
        active: false
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Field availability sync (feature 005-signal-field-coverage) — reconciles
  # config/field_availability.yaml into the field_availability table, so "can
  # this field ever be known?" is answerable in SQL alongside the observations
  # themselves.
  #
  # UNSCHEDULED by design. Determinations change only when a human investigates
  # something and records a finding; a cron would add nothing but noise, and
  # would rewrite synced_at on every row forever. Run it after editing the YAML.
  - name: field-availability-sync
    entrypoint: flows/field_availability_sync.py:field_availability_sync
    work_pool:
      name: noktah-pool
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Sheet header backfill (feature 005) — ONE-OFF migration bringing existing
  # harvest tabs to the current column layout after `shares` was appended.
  # Unscheduled and idempotent; touches only row 1, never reviewer-entered data.
  - name: sheet-header-backfill
    entrypoint: flows/sheet_header_backfill.py:sheet_header_backfill
    work_pool:
      name: noktah-pool
    parameters: {}
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Social harvest — Stories only (ephemeral, ~24h). NO schedule for now — trigger
  # manually or add a frequent schedule later. Uses roach's fast Stories listing.
  - name: social-harvest-stories
    entrypoint: flows/social_harvest_stories.py:social_harvest_stories_flow
    work_pool:
      name: noktah-pool
    schedules: []
    parameters:
      profiles: []
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Songbird — monthly content plan (feature 003). Runs on a schedule; pass the
  # client + month at run time (the empty defaults below force an explicit run).
  - name: songbird-monthly-plan
    entrypoint: flows/songbird_monthly_plan.py:songbird_monthly_plan_flow
    work_pool:
      name: noktah-pool
    schedules:
      # 06:00 on the 1st of every month. Trigger per-client runs manually or via
      # separate scheduled deployments; this default run must be given a client/month.
      - cron: "0 6 1 * *"
        timezone: "Asia/Jakarta"
    parameters:
      client: ""
      month: ""
      target: draft
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Songbird — batch content plan for one or many clients. NO schedule — trigger
  # manually. `clients` accepts a single name or a comma-separated list, e.g.
  # "Klinik Utama Gresik" or "Klinik Utama Gresik, Klinik Mata Sampang".
  # An omitted month defaults to next month.
  - name: songbird-batch-plan
    entrypoint: flows/songbird_batch_plan.py:songbird_batch_plan_flow
    work_pool:
      name: noktah-pool
    schedules: []
    parameters:
      clients: ""
      month: ""
      target: draft
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # Songbird — on-demand incidental content (feature 003). NO schedule — trigger
  # manually; pass client + quantity at run time.
  - name: songbird-generate
    entrypoint: flows/songbird_generate.py:songbird_generate_flow
    work_pool:
      name: noktah-pool
    schedules: []
    parameters:
      client: ""
      quantity: 3
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /app

  # ---------------------------------------------------------------------------
  # Noktah Hub: Otomasi & Laporan (spec 009). All report problems to #eskala-otomasi.
  # ---------------------------------------------------------------------------

  # The monthly harvest of every active Eskala Client's own and competitor accounts,
  # read from the Hub Registry (replaces the 22 harvest-monthly-* deployments, which
  # must also be deleted from the Prefect server once; see the spec's quickstart).
  # One account at a time, 30 minutes apart; 31 days each, 90 on a first harvest; own
  # and competitor accounts alike, so songbird's within-account ranking compares
  # like with like. The Hub's "Jalankan sekarang" starts this same deployment with
  # account_ids=[id] and trigger=manual.
  - name: harvest-registry
    entrypoint: flows/harvest_registry.py:harvest_registry_flow
    work_pool: *noktah_pool
    tags: [social-harvest, hub]
    schedules:
      - cron: "30 17 1 * *"
        timezone: "Asia/Jakarta"
    parameters:
      trigger: monthly
    pull: *app_dir

  # Reads each Eskala Client's Content Plan (this month and next) into the Hub, and
  # posts the watcher's Jira comments on issues whose row changed after creation.
  - name: hub-plan-watch
    entrypoint: flows/hub_plan_watch.py:hub_plan_watch_flow
    work_pool: *noktah_pool
    tags: [hub]
    schedules:
      - cron: "*/15 * * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull: *app_dir

  # "Buat issue Jira": started by hub-api with batch_id. No schedule.
  - name: hub-jira-create
    entrypoint: flows/hub_jira_create.py:hub_jira_create_flow
    work_pool: *noktah_pool
    tags: [hub]
    parameters: {}
    pull: *app_dir

  # The Hub's copy of ESKL Content and Event issues (Laporan, incentive points), and
  # the Event point comments.
  - name: hub-jira-sync
    entrypoint: flows/hub_jira_sync.py:hub_jira_sync_flow
    work_pool: *noktah_pool
    tags: [hub]
    schedules:
      - cron: "*/15 * * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull: *app_dir

  # Hourly sanctions tick: hub-api decides the working day; the flow writes the SP
  # letters as Google Docs into HUB_SP_LETTER_FOLDER_ID.
  - name: hub-sanctions
    entrypoint: flows/hub_sanctions.py:hub_sanctions_flow
    work_pool: *noktah_pool
    tags: [hub]
    schedules:
      - cron: "5 * * * *"
        timezone: "Asia/Jakarta"
    parameters: {}
    pull: *app_dir

  # ---------------------------------------------------------------------------
  # Structured extraction (feature 007-structured-extraction)
  # ---------------------------------------------------------------------------

  # Vocabulary sync — reconciles config/extraction/vocabulary_v1.yaml into
  # extraction_vocabulary_terms. UNSCHEDULED on purpose: a vocabulary change has a
  # migration-shaped blast radius (every stored beat is interpreted against the
  # version it recorded), so it is a deliberate act, not something that should
  # drift in on a cron. Run it after editing the YAML.
  - name: extraction-vocabulary-sync
    entrypoint: flows/extraction_vocabulary_sync.py:extraction_vocabulary_sync
    work_pool: *noktah_pool
    tags: [extraction, vocabulary]
    parameters: {}
    pull: *app_dir

  # Backfill — re-extract already-collected items under the current schema.
  # UNSCHEDULED: it SPENDS MODEL TOKENS and is triggered by hand. Defaults to
  # --dry-run, which makes zero model calls and reports scope + projection.
  # Gates before any spend: uncalibrated-honest projection, per-run threshold
  # (EXTRACTION_SPEND_THRESHOLD_USD), hard monthly ceiling
  # (EXTRACTION_MONTHLY_CEILING_USD, extraction spend only).
  - name: roach-extract-backfill
    entrypoint: flows/roach_extract_backfill.py:roach_extract_backfill
    work_pool: *noktah_pool
    tags: [extraction, backfill, costed]
    parameters:
      dry_run: true
    pull: *app_dir

  # Calibration — controlled two-model agreement over a FIXED sample.
  # UNSCHEDULED and COSTED: every sampled item is extracted twice, so it spends
  # roughly double per item. Refuses to report a figure below the minimum sample,
  # and short-circuits with zero calls when both paths resolve to one model.
  - name: roach-extract-calibrate
    entrypoint: flows/roach_extract_calibrate.py:roach_extract_calibrate
    work_pool: *noktah_pool
    tags: [extraction, calibration, costed]
    parameters:
      dry_run: true
    pull: *app_dir
