# Field availability determinations — feature 005-signal-field-coverage
#
# THE SOURCE OF TRUTH. Reconciled into the `field_availability` table by
# `flows/field_availability_sync.py` (FR-001a/FR-001b). Edit here, never in the
# database — a determination and the evidence behind it must be reviewable as a
# diff.
#
# Lives in config/ and NOT data/ because .gitignore ignores any directory named
# `data`, which would leave this file untracked and defeat the point entirely.
#
# Status vocabulary is CLOSED (FR-002/FR-002a). Exactly five values:
#   available                   published by the platform for this content type, and collected
#   unavailable_platform_limit  the platform does not publish it — a fact about the platform
#   not_collected_by_decision   obtainable, deliberately not collected — a fact about us
#   inconclusive                investigated, no determination reached
#   undetermined                not yet investigated
#
# Never record `not_collected_by_decision` as `unavailable_platform_limit`. That
# turns a reversible policy choice into an apparent law of nature.
#
# `evidence` is REQUIRED for every status except `undetermined` (the one status
# that means "we haven't looked", and so has nothing to cite).
#
# Baseline coverage measured against noktah_dashboard on 2026-08-02:
#   instagram/carousel  291 rows | views   0 | likes 291 | comments   0
#   instagram/image      86 rows | views   0 | likes  86 | comments   0
#   instagram/story       2 rows | views   0 | likes   0 | comments   0
#   instagram/video     291 rows | views 291 | likes 291 | comments 291
#   tiktok/video         26 rows | views  26 | likes  26 | comments  26

version: 1

determinations:

  # =========================================================================
  # Instagram — video (Reels)
  # =========================================================================
  - platform: instagram
    content_type: video
    field: likes
    status: available
    reason: Present on the gallery-dl post payload and reinforced by the Reels-grid enrichment.
    evidence: 291/291 instagram video rows carry likes (measured 2026-08-02).
    determined_on: 2026-08-02

  - platform: instagram
    content_type: video
    field: comments
    status: available
    reason: >
      Supplied by the Reels-grid endpoint /api/v1/clips/user/, which the feed
      listing omits. Fully reliable, not partial.
    evidence: >
      291/291 instagram video rows carry comments (measured 2026-08-02);
      _instagram_clip_stats reads comment_count at collect.py:767.
    determined_on: 2026-08-02

  - platform: instagram
    content_type: video
    field: views
    status: available
    reason: Play count from the same Reels-grid endpoint as comments.
    evidence: 291/291 instagram video rows carry views (measured 2026-08-02).
    determined_on: 2026-08-02

  - platform: instagram
    content_type: video
    field: shares
    status: unavailable_platform_limit
    reason: Instagram publishes no share/repost count on any public surface.
    evidence: >
      collect.py:949 emits shares=None for every Instagram item with an explicit
      comment; no Instagram surface in use exposes the field.
    determined_on: 2026-08-02

  # =========================================================================
  # Instagram — carousel
  # =========================================================================
  - platform: instagram
    content_type: carousel
    field: likes
    status: available
    reason: Present on the gallery-dl post payload.
    evidence: 291/291 instagram carousel rows carry likes (measured 2026-08-02).
    determined_on: 2026-08-02

  - platform: instagram
    content_type: carousel
    field: comments
    status: available
    reason: >
      Returned as `comment_count` by /api/v1/feed/user/<id>/ — the same endpoint
      gallery-dl already calls for the posts listing, on the same media object
      shape the clips endpoint uses. gallery-dl fetches this payload and then
      discards the field, mapping only like_count. This was never a platform
      limit; it was a mapping gap in a third-party library.
    evidence: >
      Live probe 2026-08-02 against natgeo (non-client), 4 requests of a 10
      budget, no throttle: 5/5 carousel items carried comment_count, 5/5 image,
      2/2 video (which also carried play_count). gallery-dl 1.32.6
      extractor/instagram.py:1151 routes the listing to this endpoint and :240
      maps like_count only.
    determined_on: 2026-08-02

  - platform: instagram
    content_type: carousel
    field: views
    status: unavailable_platform_limit
    reason: >
      Instagram publishes no post-level play count for non-video content. A
      carousel containing a video child exposes per-child plays, but not a
      post-level number, so there is nothing to store against the item.
    evidence: 0/291 instagram carousel rows carry views (measured 2026-08-02).
    determined_on: 2026-08-02

  - platform: instagram
    content_type: carousel
    field: shares
    status: unavailable_platform_limit
    reason: Instagram publishes no share/repost count on any public surface.
    evidence: collect.py:949 emits shares=None for every Instagram item.
    determined_on: 2026-08-02

