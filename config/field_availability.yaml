  # =========================================================================
  # Comment text — a decision, not a platform limit
  # ------------------------------------------------------------------------
  # Obtainable. Deliberately not collected. Recording this as
  # `unavailable_platform_limit` would make a reversible policy choice look like
  # a law of nature (FR-023).
  # =========================================================================
  - platform: instagram
    content_type: video
    field: comment_text
    status: not_collected_by_decision
    reason: >
      Comment threads are addressed per post and paged, so cost scales with post
      count rather than account count — roughly 4-10x the current per-account
      request baseline. That is the shape FR-010 disqualifies by name, and
      Constitution X forbids the increase. See research.md R6.
    evidence: >
      specs/005-signal-field-coverage/research.md R6: ~37-100 requests per
      account per run at 30 posts, against a ~7-10 baseline.
    determined_on: 2026-08-02

