  # =========================================================================
  # Instagram — story
  # ------------------------------------------------------------------------
  # A case the original brief did not mention. Stories carry NO public counts
  # at all — not even likes — so without these four rows the two stored story
  # rows would read as a collection failure forever.
  # =========================================================================
  - platform: instagram
    content_type: story
    field: likes
    status: unavailable_platform_limit
    reason: Instagram publishes no engagement counts on stories; they are ephemeral and unmetered publicly.
    evidence: >
      _list_instagram_stories (collect.py:838) sets all four counts to None by
      construction; 0/2 stored story rows carry likes (measured 2026-08-02).
    determined_on: 2026-08-02

  - platform: instagram
    content_type: story
    field: comments
    status: unavailable_platform_limit
    reason: Story replies are private direct messages, not a public comment thread.
    evidence: collect.py:838 sets comments=None; 0/2 stored story rows carry comments.
    determined_on: 2026-08-02

  - platform: instagram
    content_type: story
    field: views
    status: unavailable_platform_limit
    reason: Story view counts are visible only to the account owner, never publicly.
    evidence: collect.py:838 sets views=None; 0/2 stored story rows carry views.
    determined_on: 2026-08-02

  - platform: instagram
    content_type: story
    field: shares
    status: unavailable_platform_limit
    reason: Instagram publishes no share count on any surface, stories included.
